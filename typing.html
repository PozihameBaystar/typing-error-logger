<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Typing Error Logger v3</title><style>
:root{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color-scheme:light dark}body{max-width:1050px;margin:24px auto;padding:0 16px 60px}.card{border:1px solid #8886;border-radius:12px;padding:16px;margin:14px 0}.controls{display:flex;gap:10px;flex-wrap:wrap;align-items:end}label{display:flex;flex-direction:column;gap:4px}select,input,button{padding:8px}button{cursor:pointer}.muted{opacity:.7}#practice{outline:none}#jp{font-size:28px;font-weight:700}#kana{font-size:18px}.mono{font-family:ui-monospace,Consolas,monospace;font-size:22px}.badge{display:inline-block;border:1px solid #8887;border-radius:999px;padding:2px 8px;margin:2px}.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px}.stat{border:1px solid #8885;border-radius:8px;padding:10px}.big{font-size:1.25rem;font-weight:700}table{width:100%;border-collapse:collapse}td,th{padding:7px;border-bottom:1px solid #8885;text-align:left}.flash{animation:f .18s}@keyframes f{from{background:#f006}to{background:transparent}}
</style></head><body>
<h1>Typing Error Logger v3</h1><p class="muted">複数ローマ字入力対応・大量問題プール・ランダム抽選・打鍵ログ保存</p>
<div class="card"><h2>1. 出題設定</h2><div class="controls"><label>カテゴリ<select id="cat"></select></label><label>出題数<input id="count" type="number" min="1" value="50"></label><button id="start">指定数をランダム出題</button><span id="pool" class="muted"></span></div></div>
<div class="card" id="practice" tabindex="0"><h2>2. タイピング</h2><div id="jp">開始ボタンを押してください</div><div id="kana"></div><div class="muted">代表表記</div><div id="canonical" class="mono"></div><div class="muted">入力</div><div id="typed" class="mono"></div><div>現在のかな: <span id="tok" class="badge">—</span></div><div>許容ローマ字: <span id="vars">—</span></div><div>次のキー: <span id="next">—</span></div></div>
<div class="card"><h2>3. 集計</h2><div class="stats"><div class="stat">正打鍵<div class="big" id="ok">0</div></div><div class="stat">誤打鍵<div class="big" id="ng">0</div></div><div class="stat">正確率<div class="big" id="acc">—</div></div><div class="stat">完了<div class="big" id="done">0</div></div><div class="stat">経過<div class="big" id="time">—</div></div></div><h3>誤入力</h3><table><thead><tr><th>期待</th><th>誤キー</th><th>回数</th></tr></thead><tbody id="errs"></tbody></table></div>
<div class="card"><h2>4. 保存</h2><button id="json">JSONを書き出す</button><button id="csv">CSVを書き出す</button></div>
<script>
"use strict";const $=x=>document.getElementById(x),F=(d,k)=>({d,k});
const BASE=[F("寿司","すし"),F("写真","しゃしん"),F("新聞","しんぶん"),F("練習","れんしゅう"),F("技術","ぎじゅつ"),F("入力","にゅうりょく"),F("出力","しゅつりょく"),F("制御","せいぎょ"),F("解析","かいせき"),F("設計","せっけい"),F("実験","じっけん"),F("環境","かんきょう")].map(x=>({...x,c:"短い単語"}));
function comb(c,A,B,C){let o=[];for(const a of A)for(const b of B)for(const z of C)o.push({d:a.d+b.d+z.d,k:a.k+b.k+z.k,c});return o}
function poolGen(){let o=[];
const when=[F("朝は","あさは"),F("昼休みには","ひるやすみには"),F("帰宅したら","きたくしたら"),F("出かける前に","でかけるまえに"),F("休日には","きゅうじつには"),F("夜になったら","よるになったら"),F("仕事の前に","しごとのまえに"),F("時間があるときは","じかんがあるときは")],task=[F("予定を確認する","よていをかくにんする"),F("水を飲む","みずをのむ"),F("荷物を整理する","にもつをせいりする"),F("少し歩く","すこしあるく"),F("メモを読み返す","めもをよみかえす"),F("机を片付ける","つくえをかたづける"),F("必要な物を準備する","ひつようなものをじゅんびする"),F("忘れ物を確認する","わすれものをかくにんする"),F("次にやることを決める","つぎにやることをきめる"),F("窓を開けて換気する","まどをあけてかんきする"),F("写真を整理する","しゃしんをせいりする"),F("新聞を読む","しんぶんをよむ")],end=[F("ようにする","ようにする"),F("ことにしている","ことにしている"),F("と気持ちが落ち着く","ときもちがおちつく"),F("と作業しやすい","とさぎょうしやすい"),F("のを忘れない","のをわすれない"),F("と一日が進めやすい","といちにちがすすめやすい")];o.push(...comb("日常",when,task,end));
const tw=[F("練習では","れんしゅうでは"),F("最初は","さいしょは"),F("慣れるまでは","なれるまでは"),F("速度を上げる前に","そくどをあげるまえに"),F("長い文章では","ながいぶんしょうでは"),F("短い単語でも","みじかいたんごでも"),F("ミスが増えたら","みすがふえたら"),F("毎日の練習では","まいにちのれんしゅうでは")],th=[F("正しい指で","ただしいゆびで"),F("一定のリズムで","いっていのりずむで"),F("ホームポジションを意識して","ほーむぽじしょんをいしきして"),F("少し先読みしながら","すこしさきよみしながら"),F("肩の力を抜いて","かたのちからをぬいて"),F("正確さを優先して","せいかくさをゆうせんして"),F("指の移動を小さくして","ゆびのいどうをちいさくして"),F("苦手なキーを意識して","にがてなきーをいしきして"),F("左右の手を意識して","さゆうのてをいしきして"),F("ゆっくり確実に","ゆっくりかくじつに")],td=[F("文章を入力する","ぶんしょうをにゅうりょくする"),F("キーを打つ","きーをうつ"),F("練習を続ける","れんしゅうをつづける"),F("例文を繰り返す","れいぶんをくりかえす"),F("打鍵を安定させる","だけんをあんていさせる"),F("入力速度を整える","にゅうりょくそくどをととのえる"),F("ミスの位置を確認する","みすのいちをかくにんする"),F("指使いを確認する","ゆびづかいをかくにんする")];o.push(...comb("タイピング",tw,th,td));
const cx=[F("実装の前に","じっそうのまえに"),F("デバッグでは","でばっぐでは"),F("実験では","じっけんでは"),F("解析では","かいせきでは"),F("変更後は","へんこうごは"),F("テストでは","てすとでは"),F("実行するたびに","じっこうするたびに"),F("結果をまとめるときは","けっかをまとめるときは")],ct=[F("ログを","ろぐを"),F("入力値を","にゅうりょくちを"),F("出力値を","しゅつりょくちを"),F("設定値を","せっていちを"),F("実行時間を","じっこうじかんを"),F("エラー内容を","えらーないようを"),F("変数の値を","へんすうのあたいを"),F("計算結果を","けいさんけっかを"),F("データの分布を","でーたのぶんぷを"),F("変更履歴を","へんこうりれきを"),F("関数の戻り値を","かんすうのもどりちを"),F("実験条件を","じっけんじょうけんを")],co=[F("保存する","ほぞんする"),F("比較する","ひかくする"),F("確認する","かくにんする"),F("記録する","きろくする"),F("可視化する","かしかする"),F("整理する","せいりする"),F("一覧にする","いちらんにする"),F("順番に調べる","じゅんばんにしらべる"),F("別条件と比べる","べつじょうけんとくらべる"),F("ファイルに書き出す","ふぁいるにかきだす")];o.push(...comb("技術",cx,ct,co));
const rx=[F("制御系では","せいぎょけいでは"),F("シミュレーションでは","しみゅれーしょんでは"),F("実機試験では","じっきしけんでは"),F("状態推定では","じょうたいすいていでは"),F("軌道追従では","きどうついじゅうでは"),F("最適化では","さいてきかでは"),F("センサー処理では","せんさーしょりでは"),F("モデル検証では","もでるけんしょうでは")],rt=[F("姿勢角を","しせいかくを"),F("角速度を","かくそくどを"),F("車輪速度を","しゃりんそくどを"),F("制御入力を","せいぎょにゅうりょくを"),F("観測値を","かんそくちを"),F("目標値を","もくひょうちを"),F("状態量を","じょうたいりょうを"),F("トルク指令を","とるくしれいを"),F("位置偏差を","いちへんさを"),F("速度偏差を","そくどへんさを"),F("周期を","しゅうきを"),F("ゲインを","げいんを")],ro=[F("記録する","きろくする"),F("フィルタする","ふぃるたする"),F("制限する","せいげんする"),F("比較する","ひかくする"),F("更新する","こうしんする"),F("確認する","かくにんする"),F("グラフにする","ぐらふにする"),F("適切な範囲に保つ","てきせつなはんいにたもつ"),F("モデル値と比べる","もでるちとくらべる"),F("時系列で保存する","じけいれつでほぞんする")];o.push(...comb("ロボット・制御",rx,rt,ro));return [...BASE,...o]}
const PROBLEMS=poolGen();
const R={"あ":["a"],"い":["i"],"う":["u"],"え":["e"],"お":["o"],"か":["ka"],"き":["ki"],"く":["ku"],"け":["ke"],"こ":["ko"],"さ":["sa"],"し":["shi","si","ci"],"す":["su"],"せ":["se"],"そ":["so"],"た":["ta"],"ち":["chi","ti"],"つ":["tsu","tu"],"て":["te"],"と":["to"],"な":["na"],"に":["ni"],"ぬ":["nu"],"ね":["ne"],"の":["no"],"は":["ha"],"ひ":["hi"],"ふ":["fu","hu"],"へ":["he"],"ほ":["ho"],"ま":["ma"],"み":["mi"],"む":["mu"],"め":["me"],"も":["mo"],"や":["ya"],"ゆ":["yu"],"よ":["yo"],"ら":["ra"],"り":["ri"],"る":["ru"],"れ":["re"],"ろ":["ro"],"わ":["wa"],"を":["wo","o"],"が":["ga"],"ぎ":["gi"],"ぐ":["gu"],"げ":["ge"],"ご":["go"],"ざ":["za"],"じ":["ji","zi"],"ず":["zu"],"ぜ":["ze"],"ぞ":["zo"],"だ":["da"],"ぢ":["di","ji"],"づ":["du","zu"],"で":["de"],"ど":["do"],"ば":["ba"],"び":["bi"],"ぶ":["bu"],"べ":["be"],"ぼ":["bo"],"ぱ":["pa"],"ぴ":["pi"],"ぷ":["pu"],"ぺ":["pe"],"ぽ":["po"],"きゃ":["kya"],"きゅ":["kyu"],"きょ":["kyo"],"しゃ":["sha","sya"],"しゅ":["shu","syu"],"しょ":["sho","syo"],"ちゃ":["cha","tya","cya"],"ちゅ":["chu","tyu","cyu"],"ちょ":["cho","tyo","cyo"],"じゃ":["ja","jya","zya"],"じゅ":["ju","jyu","zyu"],"じょ":["jo","jyo","zyo"],"にゃ":["nya"],"にゅ":["nyu"],"にょ":["nyo"],"ひゃ":["hya"],"ひゅ":["hyu"],"ひょ":["hyo"],"みゃ":["mya"],"みゅ":["myu"],"みょ":["myo"],"りゃ":["rya"],"りゅ":["ryu"],"りょ":["ryo"],"ぎゃ":["gya"],"ぎゅ":["gyu"],"ぎょ":["gyo"],"びゃ":["bya"],"びゅ":["byu"],"びょ":["byo"],"ぴゃ":["pya"],"ぴゅ":["pyu"],"ぴょ":["pyo"],"ふぁ":["fa"],"ふぃ":["fi"],"ふぇ":["fe"],"ふぉ":["fo"],"ぁ":["xa","la"],"ぃ":["xi","li"],"ぅ":["xu","lu"],"ぇ":["xe","le"],"ぉ":["xo","lo"],"ゃ":["xya","lya"],"ゅ":["xyu","lyu"],"ょ":["xyo","lyo"]};
function toks(s){let a=[];for(let i=0;i<s.length;){let q=s.slice(i,i+2);if(R[q])a.push(q),i+=2;else a.push(s[i++])}return a}function raw(t){return R[t]||[t]}function vars(ts,i){let t=ts[i];if(t==="ん"){let n=i+1<ts.length?raw(ts[i+1]).map(x=>x[0]):[];return i===ts.length-1||n.some(x=>"aiueoyn".includes(x))?["nn","n'"]:["n","nn"]}if(t==="っ"){let z=["xtu","ltu"],n=i+1<ts.length?raw(ts[i+1]):[];for(const v of n){let c=v[0];if(c&&!"aiueon".includes(c))z.push(c)}return [...new Set(z)]}if(t==="ー")return ["-"];return raw(t)}
const B=i=>({i,v:null,j:0}),key=s=>`${s.i}|${s.v||"#"}|${s.j}`;function uniq(a){let m=new Map;for(const x of a)m.set(key(x),x);return [...m.values()]}function exp(st,ts){let z=new Set;for(const s of st){if(s.i>=ts.length)continue;if(s.v===null)for(const v of vars(ts,s.i))z.add(v[0]);else z.add(s.v[s.j])}return z}function adv(st,ch,ts){let o=[];for(const s of st){if(s.i>=ts.length)continue;if(s.v===null){for(const v of vars(ts,s.i))if(v[0]===ch)o.push(v.length===1?B(s.i+1):{i:s.i,v,j:1})}else if(s.v[s.j]===ch)o.push(s.j+1===s.v.length?B(s.i+1):{i:s.i,v:s.v,j:s.j+1})}return uniq(o)}
let qs=[],qi=0,ts=[],st=[],typed="",events=[],active=false,startT=0,promptT=0;function shuffle(a){a=[...a];for(let i=a.length-1;i;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}function cats(){return [...new Set(PROBLEMS.map(x=>x.c))]}function subset(){let c=$("cat").value;return PROBLEMS.filter(x=>c==="すべて"||x.c===c)}function poolInfo(){let n=subset().length;$("count").max=n;$("pool").textContent=`${n.toLocaleString()}題から重複なしランダム抽選`;if(+$('count').value>n)$('count').value=n}function init(){let cs=["すべて",...cats()];$("cat").innerHTML=cs.map(c=>`<option value="${c}">${c} (${(c==="すべて"?PROBLEMS.length:PROBLEMS.filter(x=>x.c===c).length).toLocaleString()}題)</option>`).join("");poolInfo()}
function begin(){let a=shuffle(subset()),n=Math.max(1,Math.min(+$('count').value||50,a.length));qs=a.slice(0,n);qi=0;events=[];active=true;startT=performance.now();load();$("practice").focus()}function load(){if(qi>=qs.length){active=false;$("jp").textContent="完了";return}ts=toks(qs[qi].k);st=[B(0)];typed="";promptT=performance.now();render()}function render(){let q=qs[qi];$("jp").textContent=`${qi+1}/${qs.length} ${q.d}`;$("kana").textContent=`よみ: ${q.k}`;$("canonical").textContent=ts.map((_,i)=>vars(ts,i)[0]).join("");$("typed").textContent=typed;let i=Math.min(...st.filter(x=>x.i<ts.length).map(x=>x.i),ts.length);if(i<ts.length){$("tok").textContent=ts[i];$("vars").innerHTML=vars(ts,i).map(x=>`<span class="badge">${x}</span>`).join("")}else{$("tok").textContent="—";$("vars").textContent="—"}$("next").innerHTML=[...exp(st,ts)].map(x=>`<span class="badge">${x}</span>`).join("");stats()}
function hit(e){if(!active||e.ctrlKey||e.altKey||e.metaKey)return;let ch=e.key.length===1?e.key.toLowerCase():e.key,ex=[...exp(st,ts)],ns=ch.length===1?adv(st,ch,ts):[],ok=ns.length>0,t=performance.now();events.push({time_ms:+(t-startT).toFixed(2),question:qi,text:qs[qi].d,kana:qs[qi].k,typed_before:typed,expected:ex,actual:ch,correct:ok,prompt_ms:+(t-promptT).toFixed(2)});if(ok){st=ns;typed+=ch;if(st.some(x=>x.i>=ts.length&&x.v===null)){events.push({type:"complete",question:qi,romaji:typed,time_ms:+(t-startT).toFixed(2)});qi++;load()}else render()}else if(ch.length===1){let p=$("practice");p.classList.remove("flash");void p.offsetWidth;p.classList.add("flash")}stats()}
function stats(){let k=events.filter(x=>!x.type),ok=k.filter(x=>x.correct).length,ng=k.filter(x=>!x.correct&&x.actual?.length===1);$("ok").textContent=ok;$("ng").textContent=ng.length;$("acc").textContent=ok+ng.length?`${(100*ok/(ok+ng.length)).toFixed(2)}%`:"—";$("done").textContent=events.filter(x=>x.type==="complete").length;$("time").textContent=startT?`${((performance.now()-startT)/1000).toFixed(1)}s`:"—";let m={};for(const x of ng){let a=x.expected.join("/"),z=x.actual,key=a+"→"+z;m[key]=(m[key]||0)+1}$("errs").innerHTML=Object.entries(m).sort((a,b)=>b[1]-a[1]).slice(0,15).map(([k,n])=>{let [a,z]=k.split("→");return`<tr><td>${a}</td><td>${z}</td><td>${n}</td></tr>`}).join("")||'<tr><td colspan="3">まだ誤入力なし</td></tr>'}
function dl(name,text,type){let u=URL.createObjectURL(new Blob([text],{type})),a=document.createElement("a");a.href=u;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(u),500)}$("json").onclick=()=>dl("typing_log.json",JSON.stringify({format:"typing-error-logger-v3",problem_pool:PROBLEMS.length,events},null,2),"application/json");$("csv").onclick=()=>{let k=events.filter(x=>!x.type),h="time_ms,question,text,kana,typed_before,expected,actual,correct,prompt_ms\n",r=k.map(x=>[x.time_ms,x.question,x.text,x.kana,x.typed_before,x.expected.join("|"),x.actual,x.correct,x.prompt_ms].map(v=>`"${String(v).replaceAll('"','""')}"`).join(",")).join("\n");dl("typing_log.csv","\uFEFF"+h+r,"text/csv")};$("cat").onchange=poolInfo;$("start").onclick=begin;$("practice").onkeydown=hit;init();stats();
</script></body></html>
